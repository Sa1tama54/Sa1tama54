name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and generate cards
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          npx github-profile-summary-cards Sa1tama54

      - name: Push cards
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add profile-summary-card-output/ -f
          git commit -m "Update profile summary cards" || echo "Nothing to commit"
          git push origin HEAD:main
