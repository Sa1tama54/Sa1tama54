name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          fetch-depth: 0

      - name: Set git remote with token
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/Sa1tama54/Sa1tama54.git

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: "Sa1tama54"
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
