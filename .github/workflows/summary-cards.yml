name: GitHub Profile Summary Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        with:
          USERNAME: "Sa1tama54"
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          PUSH_BRANCH_NAME: "github-profile-summary-cards-output"
          COMMIT: "false"

      - name: Push cards
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Update profile summary cards"
          git push https://x-access-token:${{ secrets.TOKEN }}@github.com/Sa1tama54/Sa1tama54.git HEAD:github-profile-summary-cards-output --force
